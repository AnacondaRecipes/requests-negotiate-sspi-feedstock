{% set name = "requests-negotiate-sspi" %}
{% set version = "0.5.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/brandond/{{ name }}/archive/{{ version }}.tar.gz
  sha256: ada9105eab78e4f11081f13be63b61e1e9be80b705f6e132e05e4d7f7bfa429e
  # pip metadata: pywin32 dist name (pypiwin32 doesn't exist in conda) + static
  # version (tarball has no git metadata for version_command; else wheel says 0.0.0)
  patches:
    - patches/0001-fix-pip-metadata.patch

build:
  skip: true  # [not win]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    # upstream requirements.txt pins pypiwin32 >=223 (a PyPI repack of pywin32);
    # the conda package is pywin32
    - pywin32 >=223
    - requests >=2.0

test:
  imports:
    - requests_negotiate_sspi
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/brandond/requests-negotiate-sspi
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  summary: Windows SSPI-based Negotiate authentication support for Requests
  description: Single-Sign On HTTP Negotiate authentication using the requests library on Windows.
  doc_url: https://pypi.org/project/requests-negotiate-sspi
  dev_url: https://github.com/brandond/requests-negotiate-sspi

extra:
  recipe-maintainers:
    - theavey
    - dhirschfeld
    - rzillman
